  const html = await new Response(new Response(claro).body.pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
}
async function abrir(){
  const s = document.getElementById('pw').value;
  const lembrar = document.getElementById('lembrar').checked;
  sessionStorage.setItem('fdr_pw', s);
  if (lembrar) localStorage.setItem('fdr_pw', s);
  try { await tentar(s); }
  catch(e){
    sessionStorage.removeItem('fdr_pw'); localStorage.removeItem('fdr_pw');
    const el = document.getElementById('err'); if (el) el.textContent = 'Senha incorreta.';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') abrir(); });
const salva = localStorage.getItem('fdr_pw') || sessionStorage.getItem('fdr_pw');
if (salva) tentar(salva).catch(()=>{ sessionStorage.removeItem('fdr_pw'); localStorage.removeItem('fdr_pw'); });
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent))
  document.getElementById('hint').style.display = 'block';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
