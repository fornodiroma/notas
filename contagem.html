const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tentar(senha){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const claro = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.nonce)}, key, b64(P.data));
  const ds = new DecompressionStream('gzip');
  const html = await new Response(new Response(claro).body.pipeThrough(ds)).text();
  document.open(); document.write(html); document.close();
}
async function abrir(){
  const s = document.getElementById('pw').value, lembrar = document.getElementById('lembrar').checked;
  sessionStorage.setItem('fdr_cx_pw', s);
  if (lembrar) localStorage.setItem('fdr_cx_pw', s);
  try { await tentar(s); }
  catch(e){ sessionStorage.removeItem('fdr_cx_pw'); localStorage.removeItem('fdr_cx_pw'); const el = document.getElementById('err'); if (el) el.textContent = 'Senha incorreta.'; }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') abrir(); });
const salva = localStorage.getItem('fdr_cx_pw') || sessionStorage.getItem('fdr_cx_pw');
if (salva) tentar(salva).catch(()=>{ sessionStorage.removeItem('fdr_cx_pw'); localStorage.removeItem('fdr_cx_pw'); });
</script>
